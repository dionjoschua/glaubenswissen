/* Layout: App-Shell. Kopfzeile oben, Navigation unten am Handy / in der Kopfzeile am Desktop. Inhalt einspaltig (max 1040px), Karten-Raster für Übersichten, schmale Lesespalte (680px) für Lektionen, Geschichten und Einleitungen.
   Identität: Nachtblau + Gold, Literata für Überschriften und Bibel-Nähe, Source Sans 3 für Text. */
:root{
  --bg:#F3F5F9; --panel:#FFFFFF; --panel2:#EAEEF5; --line:#D5DCE7; --ink:#1A2233; --quiet:#56637A;
  --gold:#9A6F0E; --gold-soft:#F6EBD1; --good:#2F7D32; --ref:#2257A6; --warn:#C0392B;
  --on-gold:#FFFFFF; --on-good:#FFFFFF; --shadow:0 1px 2px rgba(16,21,31,.06), 0 4px 16px rgba(16,21,31,.05);
  --f-head:Literata, Georgia, "Times New Roman", serif; --f-body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs:16px; --nav-h:64px; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151F; --panel:#182030; --panel2:#1F2940; --line:#2A3650; --ink:#E8ECF2; --quiet:#9AA6B9;
  --gold:#E2B755; --gold-soft:#2A2617; --good:#6CC56F; --ref:#8EC1FF; --warn:#F07A7A;
  --on-gold:#1A1406; --on-good:#0E1A0E; --shadow:none; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10151F; --panel:#182030; --panel2:#1F2940; --line:#2A3650; --ink:#E8ECF2; --quiet:#9AA6B9;
  --gold:#E2B755; --gold-soft:#2A2617; --good:#6CC56F; --ref:#8EC1FF; --warn:#F07A7A;
  --on-gold:#1A1406; --on-good:#0E1A0E; --shadow:none; color-scheme:dark; }
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{ margin:0; background:var(--bg); color:var(--ink); font:var(--fs)/1.55 var(--f-body); }
[hidden]{ display:none !important; }
img{ max-width:100%; }
a{ color:var(--ref); }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; }
.num{ font-variant-numeric:tabular-nums; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.skip{ position:absolute; left:-999px; top:8px; background:var(--gold); color:var(--on-gold); padding:8px 12px; border-radius:8px; z-index:50; }
.skip:focus{ left:12px; }

/* Kopfzeile */
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); }
.hdr{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:1px solid var(--line); }
.hdr-in{ max-width:1040px; margin:0 auto; display:flex; align-items:center; gap:10px; padding-block:10px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.brand{ display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--ink); font-family:var(--f-head); font-weight:700; font-size:1.15rem; margin-right:auto; }
.brand svg{ width:28px; height:28px; flex:none; }
.ibtn{ width:40px; height:40px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); }
.ibtn svg{ width:20px; height:20px; }

/* Navigation: unten am Handy */
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--panel); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
.nav a{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 4px 8px; text-decoration:none; color:var(--quiet); font-size:.74rem; font-weight:700; }
.nav a svg{ width:22px; height:22px; }
.nav a[aria-current="page"]{ color:var(--gold); }
main{ max-width:1040px; margin:0 auto; padding-block:18px calc(var(--nav-h) + 40px); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
main.read{ max-width:720px; }
@media (min-width:820px){
  .nav{ position:static; display:flex; gap:2px; background:none; border:none; padding:0; order:2; }
  .nav a{ flex-direction:row; gap:7px; font-size:.92rem; padding:8px 12px; border-radius:10px; }
  .nav a svg{ width:18px; height:18px; }
  .nav a[aria-current="page"]{ background:var(--gold-soft); }
  .brand{ margin-right:18px; } .hdr-tools{ margin-left:auto; order:3; }
  main{ padding-bottom:56px; }
}
.hdr-tools{ display:flex; gap:6px; }

/* Typo */
h1{ font-family:var(--f-head); font-size:clamp(1.55rem, 1.2rem + 1.4vw, 2.1rem); line-height:1.18; margin:0 0 6px; text-wrap:balance; letter-spacing:-.01em; }
h2{ font-family:var(--f-head); font-size:1.15rem; margin:28px 0 12px; text-wrap:balance; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
h2 small{ font-family:var(--f-body); font-size:.82rem; font-weight:600; color:var(--quiet); }
.lead{ color:var(--quiet); margin:0 0 16px; max-width:62ch; }
.eyebrow{ font-size:.74rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--quiet); display:flex; align-items:center; gap:7px; margin-bottom:6px; }
.dot{ width:10px; height:10px; border-radius:50%; background:var(--c, var(--gold)); flex:none; display:inline-block; }
.prose p{ margin:0 0 10px; max-width:66ch; } .prose h2{ margin-top:22px; } .prose ul{ padding-left:20px; }

/* Bausteine */
.grid{ display:grid; gap:10px; grid-template-columns:repeat(auto-fit, minmax(min(100%, 290px), 1fr)); }
.kpis{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
@media (max-width:640px){ .kpis{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
.kpi{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 13px; display:flex; flex-direction:column; gap:5px; min-width:0; box-shadow:var(--shadow); text-decoration:none; color:var(--ink); }
.kpi .l{ font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--quiet); }
.kpi .v{ font-size:1.65rem; font-weight:700; line-height:1.05; font-variant-numeric:tabular-nums; }
.kpi .v small{ font-size:.9rem; color:var(--quiet); font-weight:600; }
.kpi .s{ font-size:.78rem; color:var(--quiet); }
.kpi.gold .v{ color:var(--gold); }
.bar{ height:7px; border-radius:7px; background:var(--panel2); overflow:hidden; }
.bar i{ display:block; height:100%; border-radius:7px; background:var(--c, var(--good)); }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:15px 16px; min-width:0; display:flex; flex-direction:column; gap:11px; box-shadow:var(--shadow); }
.card-h{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.74rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--quiet); }
.card p{ margin:0; }
.hero{ background:linear-gradient(135deg, color-mix(in srgb, var(--gold) 16%, var(--panel)), var(--panel) 70%); border:1px solid color-mix(in srgb, var(--gold) 35%, var(--line)); border-radius:18px; padding:18px; display:flex; flex-direction:column; gap:10px; box-shadow:var(--shadow); margin-bottom:12px; }
.hero .quote{ font-family:var(--f-head); font-size:clamp(1.12rem, 1rem + .6vw, 1.4rem); line-height:1.4; margin:0; text-wrap:pretty; }
.hero .src{ color:var(--quiet); font-weight:600; font-size:.88rem; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line); background:var(--panel2); color:var(--ink); border-radius:12px; padding:12px 14px; font-weight:700; text-decoration:none; text-align:center; min-height:46px; }
.btn.primary{ background:var(--gold); border-color:var(--gold); color:var(--on-gold); }
.btn.good{ background:var(--good); border-color:var(--good); color:var(--on-good); }
.btn.ghost{ background:none; }
.btn.sm{ min-height:38px; padding:8px 12px; font-size:.9rem; }
.btn.danger{ border-color:var(--warn); color:var(--warn); background:none; }
.btn svg{ width:18px; height:18px; flex:none; }
.row{ display:flex; gap:8px; flex-wrap:wrap; } .row > .btn{ flex:1 1 140px; }
.go{ display:flex; align-items:center; gap:12px; background:var(--gold); color:var(--on-gold); border:none; border-radius:13px; padding:13px 15px; text-align:left; text-decoration:none; }
.go .t{ flex:1; min-width:0; } .go small{ display:block; font-size:.8rem; font-weight:600; opacity:.85; } .go b{ font-size:1.04rem; display:block; line-height:1.3; }
.back{ display:inline-flex; align-items:center; gap:4px; color:var(--quiet); font-weight:700; text-decoration:none; padding:4px 0; margin-bottom:8px; }

/* Routine + Woche */
.routine{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.routine label{ display:flex; flex-direction:column; align-items:center; gap:3px; background:var(--panel2); border:1px solid var(--line); border-radius:11px; padding:9px 4px; font-size:.8rem; font-weight:700; text-align:center; cursor:pointer; color:var(--quiet); position:relative; }
.routine input{ position:absolute; opacity:0; pointer-events:none; }
.routine .ic{ font-size:1.2rem; line-height:1.2; }
.routine label.on{ border-color:var(--good); color:var(--good); background:color-mix(in srgb, var(--good) 10%, var(--panel)); }
.week{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; height:96px; align-items:end; }
.week .d{ display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.week .col{ width:100%; max-width:28px; flex:1; background:var(--panel2); border-radius:6px; display:flex; align-items:flex-end; overflow:hidden; }
.week .col i{ display:block; width:100%; background:var(--good); border-radius:6px; }
.week .d span{ font-size:.72rem; color:var(--quiet); } .week .d.today span{ color:var(--ink); font-weight:700; }

/* Listen */
.list{ display:grid; gap:6px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.item{ display:flex; align-items:center; gap:11px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 12px; text-decoration:none; color:var(--ink); min-width:0; text-align:left; width:100%; }
.item .tx{ flex:1; min-width:0; } .item .tt{ font-weight:700; display:block; line-height:1.3; } .item .rf{ font-size:.82rem; color:var(--quiet); display:block; }
.item .ck{ color:var(--good); font-weight:800; } .item .chev{ color:var(--quiet); }
.no{ flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:.88rem; background:var(--panel2); border:1px solid var(--line); }
.item.done .no{ background:var(--good); border-color:var(--good); color:var(--on-good); }
.topic{ display:flex; flex-direction:column; gap:9px; text-decoration:none; color:var(--ink); }
.topic .r1{ display:flex; align-items:center; gap:10px; }
.topic .ic{ width:38px; height:38px; border-radius:11px; display:grid; place-items:center; font-size:1.2rem; background:color-mix(in srgb, var(--c) 20%, var(--panel)); flex:none; }
.topic .n{ font-weight:700; flex:1; } .topic .pct{ font-weight:700; font-variant-numeric:tabular-nums; }
.topic .m{ font-size:.84rem; color:var(--quiet); }
.input{ width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:16px; }
.chips{ display:flex; gap:6px; overflow-x:auto; padding:10px 0 4px; scrollbar-width:none; margin:0 -2px; }

.chip{ flex:none; border:1px solid var(--line); background:var(--panel); border-radius:20px; padding:7px 12px; font-weight:700; font-size:.85rem; color:var(--quiet); display:flex; align-items:center; gap:6px; }
.chip.on{ border-color:var(--gold); color:var(--ink); background:var(--gold-soft); }
.empty{ color:var(--quiet); padding:14px; border:1px dashed var(--line); border-radius:12px; }

/* Lese-Ansichten */
.merk{ background:var(--gold-soft); border:1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius:14px; padding:14px 16px; }

.merk p{ margin:0; font-family:var(--f-head); font-size:1.13rem; line-height:1.45; }
.box{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:13px 15px; } .box p{ margin:0; }
.stack{ display:flex; flex-direction:column; gap:10px; }
.points{ list-style:none; margin:0; padding:0; counter-reset:p; display:flex; flex-direction:column; gap:7px; }
.points li{ position:relative; padding:10px 12px 10px 42px; background:var(--panel); border:1px solid var(--line); border-radius:12px; counter-increment:p; }
.points li::before{ content:counter(p); position:absolute; left:11px; top:11px; width:21px; height:21px; border-radius:50%; background:var(--c, var(--gold)); color:#10151F; font-size:.78rem; font-weight:700; display:grid; place-items:center; }
.refs{ display:flex; flex-wrap:wrap; gap:6px; }
.refs a{ font-family:var(--f-head); font-weight:700; font-size:.86rem; color:var(--ref); background:color-mix(in srgb, var(--ref) 11%, transparent); border:1px solid color-mix(in srgb, var(--ref) 32%, transparent); border-radius:20px; padding:4px 11px; text-decoration:none; }
.test{ background:var(--panel2); border:1px dashed var(--line); border-radius:14px; padding:13px 15px; }
.test .qq{ font-weight:700; margin:0 0 8px; } .ans{ margin:8px 0 0; padding:10px 12px; border-radius:10px; background:var(--panel); border:1px solid var(--line); }
.readlink{ display:flex; align-items:center; gap:11px; background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:12px 14px; color:var(--ref); font-weight:700; text-decoration:none; }
.readlink .t{ flex:1; min-width:0; } .readlink svg, .src svg{ width:18px; height:18px; flex:none; } .readlink small{ display:block; color:var(--quiet); font-weight:600; font-size:.82rem; }
details.research{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 15px; }
details.research summary{ font-weight:700; cursor:pointer; color:var(--ref); }
details.research ol{ margin:10px 0 0; padding-left:20px; } details.research li{ margin:4px 0; }
textarea{ width:100%; min-height:110px; padding:11px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font:16px/1.5 var(--f-body); resize:vertical; display:block; }
.field label{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-weight:700; margin-bottom:6px; }
.field label small{ color:var(--quiet); font-weight:600; font-size:.82rem; text-align:right; }
.pn{ display:inline-grid; place-items:center; width:23px; height:23px; border-radius:50%; background:var(--gold); color:var(--on-gold); font-size:.8rem; margin-right:7px; }
.status{ color:var(--good); font-weight:700; min-height:1.3em; font-size:.92rem; }
.pager{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pager a{ font-weight:600; font-size:.9rem; min-width:0; } .pager a span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Themen & Suche */
.input.big{ font-size:17px; padding:14px 16px; border-radius:14px; }
.qs{ display:flex; gap:8px; margin:4px 0 12px; } .qs .input{ flex:1; min-width:0; } .qs .btn{ flex:none; }
.tchips{ display:flex; flex-wrap:wrap; gap:6px; } .tchips .chip{ text-decoration:none; }
.tcat{ margin:0 0 14px; } .tcat .eyebrow{ margin-bottom:8px; }
.readlink.vl{ font-weight:700; } .readlink.vl small{ font-weight:500; color:var(--quiet); font-size:.88rem; }
.help{ background:color-mix(in srgb, var(--warn) 10%, var(--panel)); border:1px solid color-mix(in srgb, var(--warn) 45%, var(--line)); border-radius:14px; padding:14px 15px; display:flex; flex-direction:column; gap:8px; }

.numb{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 12px; text-decoration:none; color:var(--ink); font-size:.9rem; }

.flash{ background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:20px 18px; min-height:220px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); }
.flash .q{ font-family:var(--f-head); font-size:1.25rem; line-height:1.35; margin:0; }
.flash .a{ border-top:1px dashed var(--line); padding-top:12px; margin:0; }
.boxes{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.boxes div{ background:var(--panel2); border-radius:10px; padding:8px 4px; text-align:center; font-size:.74rem; color:var(--quiet); font-weight:700; }
.boxes b{ display:block; font-size:1.15rem; color:var(--ink); font-variant-numeric:tabular-nums; }

/* Vortrag */
.talk{ font-size:calc(var(--talk, 1.3) * 1rem); line-height:1.55; }
.talk section{ padding:6px 0 18px; border-bottom:1px solid var(--line); margin-bottom:14px; }
.talk .part{ font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin-bottom:6px; font-family:var(--f-body); }
.talk p{ margin:0 0 10px; white-space:pre-wrap; }
.pause{ display:inline-block; background:var(--gold-soft); color:var(--gold); border:1px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius:20px; padding:2px 12px; font-size:.8em; font-weight:700; }

.timer .clock{ font-size:1.6rem; font-weight:700; font-variant-numeric:tabular-nums; margin-right:auto; }
.timer .clock.over{ color:var(--warn); }

footer{ max-width:1040px; margin:0 auto; padding-block:0 calc(var(--nav-h) + 30px); padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); color:var(--quiet); font-size:.86rem; }
footer .fl{ display:flex; gap:14px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:16px; }

@media (min-width:820px){ footer{ padding-bottom:30px; } }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-weight:700; z-index:40; max-width:calc(100% - 32px); }
@media (min-width:820px){ .toast{ bottom:24px; } }
.seg{ display:flex; gap:4px; background:var(--panel2); border-radius:12px; padding:4px; }
.seg button{ flex:1; border:none; background:none; border-radius:9px; padding:9px 6px; font-weight:700; color:var(--quiet); }
.seg button[aria-pressed="true"]{ background:var(--panel); color:var(--ink); box-shadow:var(--shadow); }
.ph{ background:var(--gold-soft); border-radius:4px; padding:0 4px; font-weight:700; }
@media (prefers-reduced-motion: no-preference){ .bar i, .week .col i{ transition:width .4s ease, height .4s ease; } .page{ animation:fade .18s ease; } }
@keyframes fade{ from{ opacity:.6; transform:translateY(3px); } to{ opacity:1; transform:none; } }
@media print{ .hdr, .nav, footer, .timer, .no-print{ display:none !important; } main{ padding:0; } }

  m:"Evangelien: wer Jesus ist. Apostelgeschichte: wie die Gemeinde startet. Briefe: wie man als Christ lebt. Offenbarung: wie alles endet.",
  p:["<b>4 Evangelien:</b> Leben, Tod und Auferstehung von Jesus aus vier Blickwinkeln.","<b>Apostelgeschichte:</b> Der Heilige Geist kommt, die Gemeinde wächst von Jerusalem bis Rom.","<b>Briefe:</b> Paulus, Petrus, Johannes, Jakobus schreiben an Gemeinden – Glaube im Alltag.","<b>Offenbarung:</b> Jesus siegt. Gott macht alles neu."],
  r:["Johannes 20,31","Apostelgeschichte 1,8"],
  q:"Wovon handelt die Apostelgeschichte?", a:"Wie der Heilige Geist kommt und die erste Gemeinde entsteht und wächst."},
 {b:"bibel", t:"Die 4 Evangelien – der Unterschied",
  m:"Vier Berichte, ein Jesus – jeder zeigt eine andere Seite.",
  p:["<b>Matthäus:</b> Für Juden geschrieben. Jesus ist der versprochene König, viele AT-Erfüllungen.","<b>Markus:</b> Das kürzeste. Schnell, voller Taten. Jesus als der dienende Retter. Super zum Anfangen.","<b>Lukas:</b> Ein Arzt hat genau recherchiert. Jesus für alle – besonders Arme, Frauen, Außenseiter.","<b>Johannes:</b> Ganz anders. Jesus ist Gott. Die „Ich bin“-Worte stehen hier."],
  r:["Lukas 1,1–4","Johannes 20,31"],
  q:"Welches Evangelium ist am kürzesten und gut für Anfänger?", a:"Markus."},
 {b:"bibel", t:"Die Bibel richtig lesen",
  m:"Immer fragen: Wer redet – zu wem – und warum? Ein Vers ohne Zusammenhang kann das Gegenteil bedeuten.",
  p:["<b>Zusammenhang lesen:</b> Mindestens den Abschnitt davor und danach.","<b>Wer redet?</b> In Hiob reden z. B. Freunde, die Gott am Ende korrigiert.","<b>Unklares mit Klarem erklären:</b> Schwierige Stellen im Licht von eindeutigen Stellen verstehen.","<b>Jesus im Zentrum:</b> Alles läuft auf ihn zu."],
  r:["Apostelgeschichte 17,11","2. Timotheus 2,15"],
  q:"Welche drei Fragen stellst du an jeden Bibeltext?", a:"Wer redet? Zu wem? Warum?"},
 {b:"jesus", t:"Wer ist Jesus?",
  m:"Jesus ist ganz Gott und ganz Mensch zugleich.",
  p:["<b>Ganz Gott:</b> Er war von Anfang an bei Gott und ist Gott.","<b>Ganz Mensch:</b> Er wurde geboren, hatte Hunger, war müde, hat geweint.","<b>Ohne Sünde:</b> Als einziger Mensch hat er nie gesündigt.","<b>Darum kann er retten:</b> Als Mensch kann er für Menschen eintreten, als Gott kann er die Schuld tragen."],
  r:["Johannes 1,1","Johannes 1,14","Kolosser 2,9","Hebräer 4,15"],
  q:"Warum musste Jesus Gott und Mensch zugleich sein?", a:"Als Mensch konnte er für Menschen eintreten, als Gott ohne Sünde konnte er die Schuld tragen."},
 {b:"jesus", t:"Vorausgesagt im Alten Testament",
  m:"Hunderte Jahre vorher wurde angekündigt, wo, wie und warum Jesus kommt.",
  p:["<b>Geburtsort Bethlehem:</b> angekündigt in Micha 5,1.","<b>Aus Davids Familie:</b> 2. Samuel 7 und Jesaja 11.","<b>Leiden für fremde Schuld:</b> Jesaja 53 beschreibt das Kreuz Jahrhunderte vorher.","<b>Durchbohrt:</b> Psalm 22 und Sacharja 12,10."],
  r:["Micha 5,1","Jesaja 53,5","Psalm 22","Matthäus 2,5–6"],
  q:"Welches Kapitel im AT beschreibt das Leiden von Jesus besonders deutlich?", a:"Jesaja 53."},
 {b:"jesus", t:"Was Jesus gelehrt und getan hat",
  m:"Jesus hat das Reich Gottes gebracht – mit Worten, Wundern und Liebe für Sünder.",
  p:["<b>Reich Gottes:</b> Gott regiert – und jeder ist eingeladen.","<b>Bergpredigt (Matthäus 5–7):</b> Seine wichtigste Rede. Das Herz zählt, nicht nur äußere Regeln.","<b>Gleichnisse:</b> Geschichten aus dem Alltag, z. B. der verlorene Sohn.","<b>Wunder:</b> Zeichen, wer er ist – Heilungen, Brotvermehrung, Sturmstillung.","<b>Er kam für Sünder:</b> Er suchte die Verlorenen."],
  r:["Markus 1,15","Matthäus 5–7","Lukas 15","Lukas 19,10"],
  q:"Wo steht die Bergpredigt?", a:"Matthäus 5–7."},
 {b:"jesus", t:"Die 7 „Ich bin“-Worte",
  m:"Mit sieben Bildern sagt Jesus im Johannesevangelium, wer er ist.",
  p:["<b>Brot des Lebens</b> – Johannes 6,35","<b>Licht der Welt</b> – Johannes 8,12","<b>Die Tür</b> – Johannes 10,9","<b>Der gute Hirte</b> – Johannes 10,11","<b>Die Auferstehung und das Leben</b> – Johannes 11,25","<b>Der Weg, die Wahrheit und das Leben</b> – Johannes 14,6","<b>Der wahre Weinstock</b> – Johannes 15,5"],
  r:["Johannes 6,35","Johannes 14,6","Johannes 15,5"],
  q:"Nenne mindestens drei „Ich bin“-Worte.", a:"Brot des Lebens, Licht der Welt, Tür, guter Hirte, Auferstehung und Leben, Weg/Wahrheit/Leben, Weinstock."},
 {b:"jesus", t:"Das Kreuz",
  m:"Am Kreuz hat Jesus die Strafe für unsere Schuld getragen – stellvertretend für uns.",
  p:["<b>Stellvertretung:</b> Er starb an unserer Stelle.","<b>„Es ist vollbracht“:</b> Die Schuld ist vollständig bezahlt.","<b>Der Vorhang im Tempel zerriss:</b> Der Weg zu Gott ist offen.","<b>Freiwillig:</b> Niemand hat ihm das Leben genommen – er hat es gegeben."],
  r:["Johannes 19,30","Matthäus 27,51","2. Korinther 5,21","Johannes 10,18"],
  q:"Was bedeutet „Es ist vollbracht“?", a:"Die Schuld ist vollständig bezahlt – es muss nichts mehr dazukommen."},
 {b:"jesus", t:"Auferstehung, Himmelfahrt, Wiederkunft",
  m:"Jesus ist auferstanden, zum Vater gegangen – und er kommt wieder.",
  p:["<b>Auferstehung:</b> Am dritten Tag war das Grab leer. Über 500 Menschen haben ihn gesehen.","<b>Ohne Auferstehung</b> wäre der Glaube sinnlos – mit ihr ist der Tod besiegt.","<b>Himmelfahrt:</b> Nach 40 Tagen ist er zum Vater gegangen.","<b>Wiederkunft:</b> Er kommt sichtbar zurück, richtet und macht alles neu."],
  r:["1. Korinther 15,3–6","1. Korinther 15,14","Apostelgeschichte 1,9–11"],
  q:"Wie viele Menschen haben den Auferstandenen laut Paulus gesehen?", a:"Über 500 (1. Korinther 15,6)."},
 {b:"evang", t:"Das Evangelium in 4 Worten",
  m:"Gott – Mensch – Jesus – Antwort. Damit kannst du jedem das Evangelium erklären.",
  p:["<b>Gott:</b> Er ist heilig und liebt uns.","<b>Mensch:</b> Wir haben gesündigt und sind von Gott getrennt.","<b>Jesus:</b> Er ist für uns gestorben und auferstanden.","<b>Antwort:</b> Umkehren und Jesus vertrauen."],
  r:["Römer 3,23","Römer 6,23","Römer 5,8","Römer 10,9"],
  q:"Wie heißen die 4 Worte des Evangeliums?", a:"Gott – Mensch – Jesus – Antwort."},
 {b:"evang", t:"Was ist Sünde?",
  m:"Sünde heißt: das Ziel verfehlen. Ohne Gott leben und gegen seinen Willen handeln.",
  p:["<b>Nicht nur Taten:</b> Auch Gedanken, Worte und das Gute, das wir nicht tun.","<b>Alle sind betroffen:</b> Keiner ist gerecht.","<b>Ein Gebot gebrochen = schuldig am ganzen Gesetz.</b>","<b>Die Folge:</b> Trennung von Gott und am Ende der Tod."],
  r:["Römer 3,23","Jakobus 2,10","Römer 6,23","Jesaja 59,2"],
  q:"Was bedeutet das Wort Sünde ursprünglich?", a:"Das Ziel verfehlen."},
 {b:"evang", t:"Gnade",
  m:"Gnade heißt: Gott schenkt dir, was du nicht verdient hast.",
  p:["<b>Unverdient:</b> Nicht durch Leistung, nicht durch gute Taten.","<b>Geschenk:</b> Man kann es nur annehmen.","<b>Keiner kann sich rühmen.</b>","<b>Gnade verändert:</b> Wer sie erlebt, will anders leben – nicht um sich etwas zu verdienen, sondern aus Dank."],
  r:["Epheser 2,8–9","Titus 3,5","Römer 6,23"],
  q:"Was ist der Unterschied zwischen Lohn und Gnade?", a:"Lohn verdient man, Gnade ist ein unverdientes Geschenk."},
 {b:"evang", t:"Umkehr und Glaube",
  m:"Umkehren heißt: weg von der Sünde, hin zu Gott. Glauben heißt: Jesus vertrauen.",
  p:["<b>Umkehr (Buße):</b> Ehrlich werden, Schuld bekennen, die Richtung ändern.","<b>Glaube:</b> Nicht nur „für wahr halten“, sondern Jesus das Leben anvertrauen.","<b>Bekennen und glauben:</b> mit dem Mund bekennen, im Herzen glauben.","<b>Gott vergibt:</b> treu und gerecht."],
  r:["Markus 1,15","Apostelgeschichte 3,19","Römer 10,9–10","1. Johannes 1,9"],
  q:"Was ist mehr als nur „für wahr halten“?", a:"Echter Glaube: Jesus das eigene Leben anvertrauen."},
 {b:"evang", t:"Neues Leben und Gewissheit",
  m:"Wer zu Jesus gehört, ist ein neuer Mensch – und darf sicher wissen, dass er ewiges Leben hat.",
  p:["<b>Neue Kreatur:</b> Das Alte ist vergangen.","<b>Gottes Kind:</b> Wer Jesus aufnimmt, wird Kind Gottes.","<b>Gewissheit:</b> Sie hängt an Gottes Versprechen, nicht am Gefühl.","<b>Niemand reißt dich aus seiner Hand.</b>"],
  r:["2. Korinther 5,17","Johannes 1,12","1. Johannes 5,13","Johannes 10,28"],
  q:"Woran hängt die Heilsgewissheit – am Gefühl oder an etwas anderem?", a:"An Gottes Versprechen, nicht am Gefühl."},
 {b:"glaube", t:"Wer ist Gott?",
  m:"Gott ist heilig, gerecht und Liebe – und er will Beziehung mit dir.",
  p:["<b>Heilig:</b> Völlig rein, ohne jedes Böse.","<b>Gerecht:</b> Ihm ist Unrecht nicht egal.","<b>Liebe:</b> Nicht nur liebevoll – er ist Liebe.","<b>Allmächtig, allwissend, überall:</b> Nichts ist ihm unmöglich oder verborgen.","<b>Ewig und treu:</b> Er ändert sich nicht."],
  r:["Jesaja 6,3","1. Johannes 4,8","Psalm 139","Maleachi 3,6"],
  q:"Nenne drei Eigenschaften Gottes.", a:"Z. B. heilig, gerecht, Liebe, allmächtig, allwissend, ewig, treu."},
 {b:"glaube", t:"Die Dreieinigkeit",
  m:"Ein Gott in drei Personen: Vater, Sohn und Heiliger Geist.",
  p:["<b>Es gibt nur einen Gott.</b>","<b>Drei Personen:</b> Vater, Sohn (Jesus) und Heiliger Geist – alle drei sind Gott.","<b>Zusammen in einem Vers:</b> Taufe auf den Namen des Vaters, des Sohnes und des Heiligen Geistes.","<b>Ehrlich:</b> Kein Vergleich passt perfekt. Gott ist größer als unser Verstand."],
  r:["5. Mose 6,4","Matthäus 28,19","Matthäus 3,16–17"],
  q:"Bei welchem Ereignis sind Vater, Sohn und Geist gleichzeitig zu sehen und zu hören?", a:"Bei der Taufe von Jesus (Matthäus 3,16–17)."},
 {b:"glaube", t:"Der Heilige Geist",
  m:"Der Heilige Geist ist Gott, der in jedem Christen wohnt.",
  p:["<b>Eine Person, keine Kraft:</b> Er lehrt, tröstet, führt.","<b>Er wohnt in dir:</b> Dein Leib ist sein Tempel.","<b>Er verändert:</b> Frucht des Geistes – Liebe, Freude, Friede, Geduld …","<b>Er gibt Kraft</b>, Zeuge für Jesus zu sein."],
  r:["Johannes 14,26","1. Korinther 6,19","Galater 5,22–23","Apostelgeschichte 1,8"],
  q:"Nenne drei Teile der Frucht des Geistes.", a:"Liebe, Freude, Friede, Geduld, Freundlichkeit, Güte, Treue, Sanftmut, Selbstbeherrschung."},
 {b:"glaube", t:"Gebet",
  m:"Gebet ist Reden mit Gott – wie ein Kind mit seinem Vater.",
  p:["<b>Das Vaterunser als Muster:</b> Gott ehren – sein Wille – tägliches Brot – Vergebung – Schutz.","<b>Ehrlich sein:</b> Auch Zweifel und Klagen dürfen rein (siehe Psalmen).","<b>Ohne Unterlass:</b> Gebet ist eine Haltung, nicht nur eine Uhrzeit.","<b>Der Geist hilft</b>, wenn wir nicht wissen, was wir beten sollen."],
  r:["Matthäus 6,9–13","Philipper 4,6–7","1. Thessalonicher 5,17","Römer 8,26"],
  q:"Welches Gebet hat Jesus als Muster gegeben?", a:"Das Vaterunser (Matthäus 6,9–13)."},
 {b:"glaube", t:"Gemeinde, Taufe, Abendmahl",
  m:"Christsein ist kein Einzelsport. Gott hat uns in eine Familie gestellt.",
  p:["<b>Gemeinde:</b> Der Leib Christi – jeder hat seinen Platz und seine Gaben.","<b>Taufe:</b> Öffentliches Bekenntnis: Ich gehöre zu Jesus.","<b>Abendmahl:</b> Erinnerung an das Kreuz und Gemeinschaft mit Jesus.","<b>Treffen nicht verlassen:</b> Wir brauchen einander."],
  r:["1. Korinther 12,27","Apostelgeschichte 2,38","1. Korinther 11,23–26","Hebräer 10,25"],
  q:"Woran erinnert das Abendmahl?", a:"An den Tod von Jesus am Kreuz für uns."},
 {b:"glaube", t:"Tod, Gericht und Ewigkeit",
  m:"Jeder Mensch steht einmal vor Gott. Für Christen ist der Tod nicht das Ende, sondern der Anfang.",
  p:["<b>Einmal sterben, danach das Gericht.</b>","<b>Wer an Jesus glaubt,</b> ist schon vom Tod ins Leben übergegangen.","<b>Himmel:</b> Für immer bei Gott – ohne Tränen und Leid.","<b>Neue Erde:</b> Gott macht am Ende alles neu."],
  r:["Hebräer 9,27","Johannes 5,24","Offenbarung 21,1–4"],
  q:"Was sagt Johannes 5,24 über Glaubende?", a:"Sie sind schon vom Tod ins Leben übergegangen."},
 {b:"seel", t:"Die Haltung des Seelsorgers",
  m:"Nicht ich bin der Ratgeber – Jesus ist es. Ich höre zu und bringe Gottes Wort.",
  p:["<b>Zuhören:</b> Schnell zum Hören, langsam zum Reden.","<b>Demut:</b> Nicht erhöhen, nicht überreden.","<b>Kein Druck:</b> Klarstellen, dass es kein Muss gibt.","<b>Bibel statt Meinung.</b>"],
  r:["Jesaja 9,5","Jakobus 1,19","Galater 6,1–2","1. Petrus 3,15"],
  q:"Wer ist der eigentliche Ratgeber in der Seelsorge?", a:"Jesus – der „Wunder-Rat“ (Jesaja 9,5)."},
 {b:"seel", t:"Die drei Arten von Menschen",
  m:"Erst erkennen, wer vor dir steht – dann weißt du, was er braucht.",
  p:["<b>Bekehrt:</b> braucht Aufbau, Stütze, Ermutigung.","<b>Unbekehrt:</b> braucht Jesus und die frohe Botschaft.","<b>Nur scheinbar bekehrt:</b> meint, es aus eigener Kraft geschafft zu haben – braucht sanfte Selbstprüfung (Matthäus 7,21–23)."],
  r:["1. Thessalonicher 5,11","Johannes 3,16","2. Korinther 13,5"],
  q:"Was braucht jemand, der nur scheinbar bekehrt ist?", a:"Eine sanfte, ehrliche Selbstprüfung."},
 {b:"seel", t:"Das Evangelium im Gespräch",
  m:"Mit vier Versen aus dem Römerbrief kannst du das ganze Evangelium erklären.",
  p:["<b>Römer 3,23:</b> Alle haben gesündigt.","<b>Römer 6,23:</b> Die Folge ist der Tod – aber Gott schenkt ewiges Leben.","<b>Römer 5,8:</b> Christus starb für uns, als wir noch Sünder waren.","<b>Römer 10,9–10:</b> Bekennen und glauben – gerettet.","<b>Tipp:</b> Schreib in deiner Bibel neben jeden Vers den nächsten („→ Röm 6,23“)."],
  r:["Römer 3,23","Römer 6,23","Römer 5,8","Römer 10,9–10"],
  q:"Nenne die 4 Verse des Römer-Wegs in der richtigen Reihenfolge.", a:"Römer 3,23 → 6,23 → 5,8 → 10,9–10."},
 {b:"seel", t:"Grenzen kennen",
  m:"Bei schweren Fällen nicht allein weitermachen – einen älteren, erfahrenen Bruder dazuholen.",
  p:["<b>Schwere Fälle:</b> Suizidgedanken, Gewalt, Sucht, große seelische Not.","<b>Wo viele Ratgeber sind, findet sich Hilfe.</b>","<b>Vertrauen schützen:</b> Persönliches nicht weitererzählen.","<b>Selbst versorgt bleiben:</b> Auch der Seelsorger braucht Gebet und Begleitung."],
  r:["Sprüche 11,14","Sprüche 11,13","Galater 6,2"],
  q:"Was tust du bei einem schweren Fall?", a:"Nicht allein weitermachen, sondern einen erfahrenen Bruder dazuholen."},
 {b:"rede", t:"Der Aufbau einer Einleitung",
  m:"Einstieg – Spiegel – Wendepunkt – Hoffnung – Überleitung. Fünf Teile, fünf Minuten.",
  p:["<b>Einstieg:</b> Ein Bild oder eine Frage, die jeder kennt.","<b>Spiegel:</b> 2–3 Fragen mit Pausen. Hier entsteht Bewegung.","<b>Wendepunkt:</b> „Ich stehe hier mittendrin.“ Dich selbst einschließen.","<b>Hoffnung:</b> Was Gott verspricht.","<b>Überleitung:</b> „Lasst uns hören, was Gott uns sagen will.“"],
  r:["Kolosser 4,6"],
  q:"Wie heißen die 5 Teile einer Einleitung?", a:"Einstieg, Spiegel, Wendepunkt, Hoffnung, Überleitung."},
 {b:"rede", t:"Gute Vergleiche und Pausen",
  m:"Ein gutes Bild bleibt länger hängen als zehn gute Sätze. Und eine Pause wirkt stärker als jedes Wort.",
  p:["<b>Bilder aus dem Alltag:</b> Tanken, Haus auf Sand, Auge des Sturms.","<b>Ein Bild pro Einleitung</b> – und es später nochmal aufgreifen.","<b>Pausen aushalten:</b> Nach Fragen 3–5 Sekunden still sein.","<b>Laut üben:</b> Zwei-, dreimal vorher, dann frei sprechen."],
  r:["Matthäus 13,34"],
  q:"Wie lange solltest du nach einer Frage still sein?", a:"Etwa 3–5 Sekunden – die Pause aushalten."}
];

const BOOKS = {GEN:"1. Mose",EXO:"2. Mose",LEV:"3. Mose",NUM:"4. Mose",DEU:"5. Mose",JOS:"Josua",JDG:"Richter",RUT:"Rut","1SA":"1. Samuel","2SA":"2. Samuel","1KI":"1. Könige","2KI":"2. Könige",NEH:"Nehemia",EST:"Ester",JOB:"Hiob",PSA:"Psalm",PRO:"Sprüche",ECC:"Prediger",ISA:"Jesaja",JER:"Jeremia",EZK:"Hesekiel",DAN:"Daniel",JON:"Jona",MIC:"Micha",ZEC:"Sacharja",MAL:"Maleachi",MAT:"Matthäus",MRK:"Markus",LUK:"Lukas",JHN:"Johannes",ACT:"Apostelgeschichte",ROM:"Römer","1CO":"1. Korinther","2CO":"2. Korinther",GAL:"Galater",EPH:"Epheser",PHP:"Philipper",COL:"Kolosser","1TH":"1. Thessalonicher","2TI":"2. Timotheus",TIT:"Titus",HEB:"Hebräer",JAS:"Jakobus","1PE":"1. Petrus","1JN":"1. Johannes",REV:"Offenbarung"};
const CODE = Object.fromEntries(Object.entries(BOOKS).map(([k,v]) => [v,k]));
const BIBLE = "https://www.bible.com/de/bible/73/";
const segText = (s, withBook) => { const [b,c,v] = s.split("."); return (withBook ? BOOKS[b] + " " : "") + c + (v ? "," + v.replace(/-/g, "–").replace(/,/g, ".") : ""); };
function refText(list){ let out = "", last = ""; list.forEach((s,i) => { const b = s.split(".")[0]; out += (i ? " · " : "") + segText(s, b !== last); last = b; }); return out; }
function refUrl(r){
  const m = r.match(/^(.+?)\s+(\d+)(?:,(\d+))?(?:[–-](\d+))?(?:,(\d+))?$/);
  if (!m || !CODE[m[1]]) return "https://www.bible.com/de/search/bible?q=" + encodeURIComponent(r);
  const [, book, c, v1, x, v2] = m, code = CODE[book];
  if (!v1) return BIBLE + code + "." + c + ".HFA";
  if (v2) return BIBLE + code + "." + c + "." + v1 + ".HFA";
  return BIBLE + code + "." + c + "." + v1 + (x ? "-" + x : "") + ".HFA";
}

const ST = [
["ur","Die Schöpfung","GEN.1.1-31|GEN.2.1-3","Gott spricht, und die Welt entsteht: Licht, Himmel, Land, Pflanzen, Tiere. Zuletzt schafft er den Menschen nach seinem Bild. Am siebten Tag ruht er.","Du bist kein Zufall. Gott hat dich gewollt und gut gemacht.","Was ändert sich, wenn ich wirklich glaube, dass ich gewollt bin?"],
["ur","Adam und Eva im Garten","GEN.2.4-25","Gott formt Adam aus Erde und haucht ihm Leben ein. Er setzt ihn in den Garten Eden und schafft Eva als Gegenüber. Sie leben ohne Scham in Gottes Nähe.","Gott hat den Menschen für Beziehung geschaffen: mit ihm und miteinander.","Wofür bin ich eigentlich gemacht?"],
["ur","Der Sündenfall","GEN.3.1-24","Die Schlange sät Zweifel an Gottes Wort. Eva und Adam essen vom verbotenen Baum, schämen sich und verstecken sich. Gott sucht sie trotzdem und ruft: Wo bist du?","Sünde trennt von Gott, aber Gott geht dem Menschen nach.","Wo verstecke ich mich vor Gott?"],
["ur","Kain und Abel","GEN.4.1-16","Kain ist neidisch, weil Gott Abels Opfer annimmt. Gott warnt ihn, doch Kain erschlägt seinen Bruder. Trotzdem schützt Gott Kain mit einem Zeichen.","Neid, der nicht beherrscht wird, zerstört. Gott warnt, bevor es zu spät ist.","Was mache ich mit dem Neid in meinem Herzen?"],
["ur","Noah und die Arche","GEN.6.5-22|GEN.7.1-24|GEN.8.1-22|GEN.9.1-17","Die Welt ist voller Gewalt. Gott rettet Noah, seine Familie und die Tiere in der Arche vor der Flut. Danach setzt er den Regenbogen als Zeichen seines Bundes.","Gott richtet das Böse, aber er rettet die, die ihm vertrauen.","Würde ich weiterbauen, wenn alle über mich lachen?"],
["ur","Der Turmbau zu Babel","GEN.11.1-9","Die Menschen wollen einen Turm bis zum Himmel bauen und sich einen Namen machen. Gott verwirrt ihre Sprache und zerstreut sie über die Erde.","Wer sich selbst groß machen will, baut ohne Gott auf Sand.","Wofür will ich mir einen Namen machen?"],
["vae","Gottes Ruf an Abraham","GEN.12.1-9","Gott ruft Abram aus seiner Heimat in ein unbekanntes Land. Er verspricht ihm Segen, ein großes Volk und dass durch ihn alle Völker gesegnet werden. Abram geht los.","Glaube heißt losgehen, auch wenn man das Ziel noch nicht sieht.","Was würde ich zurücklassen, wenn Gott mich ruft?"],
["vae","Die Sterne am Himmel","GEN.15.1-21","Abram hat noch keine Kinder und zweifelt. Gott führt ihn hinaus: Zähl die Sterne, so viele Nachkommen wirst du haben. Abram glaubt, und Gott rechnet es ihm als Gerechtigkeit an.","Gerecht vor Gott wird man durch Vertrauen, nicht durch Leistung.","Woran halte ich mich, wenn Gottes Versprechen auf sich warten lassen?"],
["vae","Hagar in der Wüste","GEN.16.1-16","Sara gibt Abram ihre Magd Hagar, damit sie ein Kind bekommen. Es gibt Streit, Hagar flieht in die Wüste. Dort begegnet ihr Gott, und sie nennt ihn: Du bist ein Gott, der mich sieht.","Gott sieht auch die, die von anderen übersehen werden.","Wo fühle ich mich übersehen?"],
["vae","Sara lacht","GEN.18.1-15","Drei Männer besuchen Abraham. Einer kündigt an, dass die alte Sara in einem Jahr einen Sohn hat. Sara lacht heimlich. Gott fragt: Sollte für mich etwas zu schwer sein?","Für Gott ist nichts unmöglich, auch wenn es menschlich lächerlich klingt.","Worüber habe ich innerlich gelacht, weil ich es Gott nicht zutraue?"],
["vae","Sodom und Gomorra","GEN.18.16-33|GEN.19.1-29","Abraham bittet für Sodom, und Gott würde schon wegen zehn Gerechten verschonen. Engel retten Lot und seine Familie. Lots Frau blickt zurück und wird zur Salzsäule.","Gott hört auf Fürbitte. Wer gerettet wird, soll nicht am Alten hängen.","Wem trauere ich hinterher, obwohl Gott mich herausgeholt hat?"],
["vae","Abraham opfert Isaak","GEN.22.1-19","Gott prüft Abraham und fordert seinen Sohn Isaak. Abraham gehorcht. Im letzten Moment hält Gott ihn zurück und gibt einen Widder als Ersatz. Gott sieht vor.","Gott verlangt Vertrauen und gibt selbst das Opfer, am Ende in Jesus.","Gibt es etwas, das ich Gott nicht hergeben will?"],
["vae","Rebekka am Brunnen","GEN.24","Abrahams Knecht soll eine Frau für Isaak finden. Er betet um ein Zeichen. Rebekka gibt ihm und seinen Kamelen Wasser und sagt Ja zur Reise.","Gott führt im Alltag, wenn man betet und offen bleibt.","Bitte ich Gott bei wichtigen Entscheidungen wirklich um Führung?"],
["vae","Esau verkauft sein Erstgeburtsrecht","GEN.25.27-34","Esau kommt hungrig von der Jagd. Für ein Linsengericht verkauft er Jakob sein Erstgeburtsrecht. Der Moment war ihm wichtiger als die Zukunft.","Wer für den schnellen Genuss lebt, verspielt das Wertvolle.","Was ist mein Linsengericht?"],
["vae","Jakob erschleicht den Segen","GEN.27.1-45","Rebekka und Jakob täuschen den blinden Isaak. Jakob gibt sich als Esau aus und bekommt den Segen. Esau will ihn töten, Jakob muss fliehen.","Lüge bringt kurzfristig Gewinn und langfristig Flucht.","Wo versuche ich mit Tricks zu bekommen, was Gott schenken will?"],
["vae","Die Himmelsleiter","GEN.28.10-22","Jakob ist auf der Flucht und schläft auf einem Stein. Im Traum sieht er eine Leiter bis zum Himmel. Gott verspricht: Ich bin mit dir und behüte dich.","Gott begegnet dir genau dort, wo du am Tiefpunkt bist.","Wo hat Gott mich überrascht, als ich nicht mit ihm gerechnet habe?"],
["vae","Jakob, Lea und Rahel","GEN.29.1-30","Jakob arbeitet sieben Jahre für Rahel. Laban betrügt ihn und gibt ihm Lea. Jakob arbeitet weitere sieben Jahre. Der Betrüger wird selbst betrogen.","Was man sät, erntet man. Gott arbeitet trotzdem weiter an Jakob.","Wo ernte ich gerade, was ich gesät habe?"],
["vae","Jakob ringt mit Gott","GEN.32.23-33","In der Nacht vor dem Treffen mit Esau ringt Jakob mit einem Mann bis zum Morgen. Er sagt: Ich lasse dich nicht, du segnest mich denn. Er bekommt den Namen Israel und hinkt seitdem.","Gott verändert dich im Kampf. Wer festhält, wird gesegnet.","Womit ringe ich gerade mit Gott?"],
["vae","Josef und seine Brüder","GEN.37.1-36","Josef ist Jakobs Liebling und erzählt von seinen Träumen. Seine Brüder hassen ihn, werfen ihn in einen Brunnen und verkaufen ihn nach Ägypten.","Neid und Bevorzugung zerstören Familien.","Wie gehe ich mit Neid in meiner Familie um?"],
["vae","Josef bei Potifar","GEN.39.1-23","Josef dient treu in Potifars Haus. Dessen Frau will ihn verführen, Josef flieht. Er landet unschuldig im Gefängnis, doch Gott ist mit ihm.","Treue zu Gott kostet manchmal etwas, aber Gott bleibt bei dir.","Wovor muss ich fliehen, statt es auszutesten?"],
["vae","Josef deutet Pharaos Träume","GEN.41","Pharao träumt von sieben fetten und sieben mageren Kühen. Josef deutet: sieben gute Jahre, dann sieben Hungerjahre. Er wird zum zweitmächtigsten Mann Ägyptens.","Gott kann dich vom Gefängnis in den Palast bringen, zu seiner Zeit.","Kann ich warten, bis Gottes Zeit da ist?"],
["vae","Josef vergibt seinen Brüdern","GEN.45.1-15|GEN.50.15-21","In der Hungersnot kommen die Brüder nach Ägypten. Josef gibt sich zu erkennen und vergibt. Später sagt er: Ihr gedachtet es böse zu machen, Gott gedachte es gut zu machen (1. Mose 50,20).","Gott macht aus dem Bösen, das andere dir antun, etwas Gutes.","Wem muss ich noch vergeben?"],
["mose","Mose im Schilfkörbchen","EXO.2.1-10","Pharao lässt die Jungen der Hebräer töten. Moses Mutter versteckt ihn in einem Korb am Nil. Die Tochter des Pharao findet ihn und zieht ihn auf.","Gott schützt seine Pläne mitten in der größten Gefahr.","Wo hat Gott mich bewahrt, ohne dass ich es gemerkt habe?"],
["mose","Der brennende Dornbusch","EXO.3.1-22|EXO.4.1-17","Mose hütet Schafe. Ein Dornbusch brennt, ohne zu verbrennen. Gott ruft ihn, sein Volk zu befreien, und nennt seinen Namen: Ich bin, der ich bin. Mose hat viele Ausreden.","Gott beruft nicht die Fähigen, er befähigt die Berufenen.","Welche Ausrede habe ich, wenn Gott mich ruft?"],
["mose","Die Plagen über Ägypten","EXO.7.14-29|EXO.8.1-28|EXO.9.1-35|EXO.10.1-29|EXO.11.1-10","Pharao will das Volk nicht ziehen lassen. Gott schickt zehn Plagen. Immer wieder gibt Pharao kurz nach und verhärtet danach sein Herz.","Ein Herz, das sich immer wieder verschließt, wird hart.","Wo sage ich Gott immer wieder „gleich“ und dann doch Nein?"],
["mose","Das Passa","EXO.12.1-42","In der letzten Nacht streicht jede Familie das Blut eines Lammes an die Türpfosten. Der Tod geht an diesen Häusern vorüber. Israel zieht aus Ägypten aus.","Das Blut des Lammes rettet. Jesus ist unser Passalamm.","Worauf verlasse ich mich, wenn es um Leben und Tod geht?"],
["mose","Durch das Rote Meer","EXO.14.1-31","Pharaos Heer jagt Israel bis ans Meer. Gott teilt das Wasser, Israel geht trocken hindurch, die Ägypter ertrinken. Der Herr kämpft für euch, ihr sollt still sein.","Wo du keinen Ausweg siehst, macht Gott einen Weg.","Vor welchem Meer stehe ich gerade?"],
["mose","Manna und Wachteln","EXO.16.1-36","In der Wüste murrt das Volk vor Hunger. Gott schickt jeden Morgen Manna, genug für einen Tag. Wer mehr sammelt, dem verdirbt es.","Gott versorgt täglich. Vertrauen lernt man Tag für Tag.","Kann ich Gott für heute vertrauen, ohne alles für morgen abzusichern?"],
["mose","Die Zehn Gebote","EXO.20.1-17","Am Sinai gibt Gott seinem befreiten Volk die Zehn Gebote. Sie beginnen mit: Ich bin der Herr, dein Gott, der dich aus Ägypten geführt hat.","Gottes Gebote sind die Hausordnung für Befreite, kein Weg, sich Rettung zu verdienen.","Welches Gebot fällt mir am schwersten?"],
["mose","Das goldene Kalb","EXO.32.1-35","Mose bleibt lange auf dem Berg. Das Volk wird ungeduldig, Aaron macht ein goldenes Kalb. Mose zerbricht die Tafeln und bittet dann für das Volk.","Wenn Gott zu schweigen scheint, bauen wir uns schnell eigene Götter.","Was wird mein goldenes Kalb, wenn Gott länger schweigt?"],
["mose","Die zwölf Kundschafter","NUM.13.1-33|NUM.14.1-45","Zwölf Männer erkunden Kanaan. Zehn sehen nur Riesen, Josua und Kaleb sehen Gottes Versprechen. Das Volk glaubt den zehn und muss 40 Jahre in der Wüste bleiben.","Angst sieht die Riesen, Glaube sieht Gott.","Sehe ich zuerst die Riesen oder zuerst Gott?"],
["mose","Die eherne Schlange","NUM.21.4-9","Das Volk murrt, giftige Schlangen beißen. Mose macht eine Schlange aus Bronze an einem Stab. Wer hinschaut, lebt. Jesus vergleicht sich damit (Johannes 3,14).","Rettung geschieht durch das Hinschauen auf das, was Gott aufrichtet: das Kreuz.","Worauf schaue ich, wenn die Schuld mich beißt?"],
["mose","Bileam und die Eselin","NUM.22.21-35","Bileam soll Israel verfluchen. Ein Engel stellt sich ihm in den Weg, doch nur die Eselin sieht ihn. Sie redet, und Bileam erkennt, wie blind er war.","Gott kann jeden gebrauchen, sogar einen Esel, um uns aufzuhalten.","Wen oder was benutzt Gott gerade, um mich zu stoppen?"],
["koen","Rahab und die Kundschafter","JOS.2.1-24|JOS.6.22-25","Rahab, eine Prostituierte in Jericho, versteckt zwei Kundschafter Israels. Sie glaubt an Israels Gott. Bei der Eroberung Jerichos wird sie mit ihrer ganzen Familie gerettet. Matthäus 1,5 nennt sie später im Stammbaum von Jesus.","Gott fragt nicht nach deiner Vergangenheit, sondern nach deinem Glauben.","Glaube ich, dass meine Vergangenheit Gott nicht aufhält?"],
["koen","Die Mauern von Jericho","JOS.6.1-27","Israel soll sechs Tage schweigend um Jericho ziehen, am siebten Tag siebenmal, dann rufen. Die Mauern stürzen ein.","Gottes Wege wirken oft seltsam, aber Gehorsam bringt Mauern zum Fallen.","Welche Mauer steht vor mir, die nur Gott umwerfen kann?"],
["koen","Gideon und die 300","JDG.6.11-40|JDG.7.1-25","Gideon ist ängstlich und bittet um Zeichen. Gott verkleinert sein Heer von 32.000 auf 300 Mann. Mit Krügen, Fackeln und Posaunen besiegen sie die Midianiter.","Gott siegt nicht mit der Masse, damit die Ehre bei ihm bleibt.","Wo verlasse ich mich auf Zahlen statt auf Gott?"],
["koen","Simson","JDG.16.4-31","Simson ist stark, aber schwach bei Frauen. Delila verrät sein Geheimnis, er verliert Kraft und Augenlicht. Am Ende betet er, und Gott gibt ihm noch einmal Kraft.","Gaben ohne Charakter bringen zu Fall. Aber Gott hört auch am Ende noch.","Wo spiele ich mit Gottes Gaben?"],
["koen","Rut und Noomi","RUT.1.1-22|RUT.2.1-23|RUT.3.1-18|RUT.4.1-22","Rut verliert ihren Mann und bleibt bei ihrer Schwiegermutter: Dein Gott ist mein Gott. Sie sammelt Ähren bei Boas, der sie heiratet. Sie wird Davids Urgroßmutter.","Treue im Kleinen wird zu Gottes großer Geschichte.","Wem halte ich die Treue, auch wenn es mich etwas kostet?"],
["koen","Hanna betet um ein Kind","1SA.1.1-28|1SA.2.1-11","Hanna ist kinderlos und wird verspottet. Sie schüttet im Tempel ihr Herz vor Gott aus. Gott schenkt ihr Samuel, und sie gibt ihn Gott zurück.","Gott hört ehrliches, verzweifeltes Gebet.","Habe ich Gott schon einmal mein ganzes Herz ausgeschüttet?"],
["koen","Gott ruft Samuel","1SA.3.1-21","Der junge Samuel hört nachts eine Stimme und läuft zu Eli. Beim dritten Mal sagt Eli ihm, er soll antworten: Rede, Herr, dein Knecht hört.","Gott redet auch mit jungen Menschen. Man muss lernen zuzuhören.","Wann habe ich zuletzt einfach still auf Gott gehört?"],
["koen","Saul wird König","1SA.9.1-27|1SA.10.1-27","Israel will einen König wie alle anderen Völker (1. Samuel 8). Gott gibt ihnen Saul, groß und stattlich. Bei seiner Wahl versteckt er sich zwischen dem Gepäck.","Menschen schauen auf das Äußere. Gott sucht ein gehorsames Herz.","Will ich so sein wie alle oder so, wie Gott mich will?"],
["koen","David wird gesalbt","1SA.16.1-13","Samuel soll einen Sohn Isais zum König salben. Die großen Brüder werden abgelehnt. Gott wählt den Jüngsten, der draußen die Schafe hütet: David.","Der Mensch sieht, was vor Augen ist, Gott sieht das Herz an.","Wo halte ich mich für zu jung oder zu klein?"],
["koen","David und Goliat","1SA.17","Der Riese Goliat verhöhnt Israel, alle haben Angst. Der junge David geht mit Schleuder und Steinen im Namen Gottes los und besiegt ihn.","Mit Gott ist kein Riese zu groß.","Wie heißt mein Goliat?"],
["koen","David und Jonatan","1SA.20.1-42","Sauls Sohn Jonatan liebt David wie sich selbst. Er warnt ihn vor Saul, obwohl David an seiner Stelle König werden wird.","Echte Freundschaft gönnt dem anderen mehr als sich selbst.","Habe ich einen Freund wie Jonatan, und bin ich einer?"],
["koen","David verschont Saul","1SA.24.1-23","Saul jagt David. In einer Höhle könnte David ihn töten, aber er schneidet nur einen Zipfel von seinem Mantel ab. Die Rache überlässt er Gott.","Wer Gott vertraut, muss sich nicht selbst rächen.","Wo will ich mir selbst Recht verschaffen?"],
["koen","David und Batseba","2SA.11.1-27","David bleibt zu Hause, statt mit dem Heer in den Krieg zu ziehen. Er sieht Batseba, nimmt sie zu sich und lässt ihren Mann Uria töten.","Sünde beginnt oft mit Langeweile und einem zweiten Blick.","Wo bin ich gerade nicht da, wo ich sein sollte?"],
["koen","Nathan stellt David zur Rede","2SA.12.1-25","Nathan erzählt von einem Reichen, der einem Armen sein einziges Schaf nimmt. David ist empört. Nathan sagt: Du bist der Mann! David bekennt seine Schuld (Psalm 51).","Gott schickt Menschen, die uns ehrlich den Spiegel vorhalten.","Wer darf mir ehrlich die Wahrheit sagen?"],
["koen","Salomo bittet um Weisheit","1KI.3.1-15","Gott sagt zu Salomo: Bitte, was ich dir geben soll. Salomo bittet nicht um Reichtum, sondern um ein hörendes Herz. Gott gibt ihm Weisheit und Reichtum dazu.","Wer zuerst um Weisheit bittet, bekommt mehr, als er erbeten hat.","Was würde ich bitten, wenn Gott mich das fragt?"],
["koen","Salomos Urteil","1KI.3.16-28","Zwei Frauen streiten um ein Baby. Salomo befiehlt, es zu teilen. Die echte Mutter verzichtet lieber, damit es lebt. So erkennt Salomo die Wahrheit.","Echte Liebe verzichtet, damit der andere lebt.","Woran erkennt man echte Liebe in meinem Leben?"],
["koen","Elia und die Witwe","1KI.17.1-24","In der Dürre versorgen Raben Elia. Dann gibt ihm eine arme Witwe ihr letztes Mehl. Mehl und Öl gehen nicht aus, und später erweckt Elia ihren Sohn.","Wer Gott das Letzte gibt, erlebt seine Versorgung.","Was ist das Letzte, das ich festhalte?"],
["koen","Elia auf dem Karmel","1KI.18.20-46","Elia fordert 450 Baalspropheten heraus: Welcher Gott antwortet mit Feuer? Baal schweigt. Elia betet, und Gott schickt Feuer auf das nasse Opfer.","Man kann nicht auf beiden Seiten hinken. Der Herr ist Gott.","Zwischen welchen zwei Seiten hinke ich?"],
["koen","Elia unter dem Ginster","1KI.19.1-18","Nach dem Sieg flieht Elia vor Isebel und will sterben. Ein Engel gibt ihm Brot und Wasser. Am Horeb begegnet Gott ihm nicht im Sturm, sondern in einem leisen Säuseln.","Gott kümmert sich um Erschöpfte, zuerst mit Brot und Schlaf, dann mit seiner Stimme.","Bin ich gerade ausgebrannt?"],
["koen","Naaman wird geheilt","2KI.5.1-27","Der syrische Feldherr Naaman hat Aussatz. Eine verschleppte Magd erzählt ihm vom Propheten. Elisa sagt: Tauche siebenmal im Jordan unter. Naaman ist gekränkt, gehorcht dann und wird gesund.","Gottes Heilung erfordert Demut.","Wo ist mir Gottes Weg zu einfach oder zu peinlich?"],
["koen","Josia findet das Gesetzbuch","2KI.22.1-20|2KI.23.1-3","Beim Renovieren des Tempels wird das vergessene Gesetzbuch gefunden. Der junge König Josia zerreißt seine Kleider und führt das Volk zurück zu Gott.","Erneuerung beginnt, wenn Gottes Wort wieder gelesen wird.","Liegt meine Bibel verstaubt in der Ecke?"],
["proph","Jesaja wird berufen","ISA.6.1-13","Jesaja sieht Gott auf dem Thron, Engel rufen: Heilig, heilig, heilig. Er erkennt seine Unreinheit, ein Engel reinigt seine Lippen. Gott fragt: Wen soll ich senden? Jesaja: Hier bin ich, sende mich!","Wer Gottes Heiligkeit und Gnade erlebt, wird bereit, sich senden zu lassen.","Würde ich „Hier bin ich“ sagen?"],
["proph","Beim Töpfer","JER.18.1-12","Jeremia sieht, wie ein Töpfer ein misslungenes Gefäß neu formt. Gott sagt: Wie der Ton in der Hand des Töpfers, so seid ihr in meiner Hand.","Gott gibt nicht auf, er formt neu.","Lasse ich mich von Gott formen?"],
["proph","Das Tal der Totengebeine","EZK.37.1-14","Hesekiel sieht ein Tal voller vertrockneter Knochen. Er soll Gottes Wort darüber sprechen. Die Knochen fügen sich zusammen, und Gottes Geist macht sie lebendig.","Gott kann auch das Tote wieder lebendig machen.","Was in meinem Leben fühlt sich tot an?"],
["proph","Daniel bleibt treu","DAN.1.1-21","Daniel und seine Freunde werden nach Babylon verschleppt. Sie wollen nicht vom Essen des Königs essen und bitten um einen Test. Nach zehn Tagen sehen sie gesünder aus als alle anderen.","Treue zu Gott beginnt im Kleinen, auch in fremder Umgebung.","Wo passe ich mich an, wo ich standhaft bleiben sollte?"],
["proph","Der Feuerofen","DAN.3.1-30","Schadrach, Meschach und Abed-Nego beten das goldene Bild nicht an. Sie sagen: Gott kann uns retten, und wenn nicht, beten wir es trotzdem nicht an. Im Ofen ist ein Vierter bei ihnen.","Gott bewahrt nicht immer vor dem Feuer, aber im Feuer.","Würde ich auch sagen: Und wenn nicht?"],
["proph","Die Schrift an der Wand","DAN.5.1-30","König Belsazar feiert mit den heiligen Gefäßen aus dem Tempel. Eine Hand schreibt an die Wand. Daniel deutet: gewogen und zu leicht befunden. In derselben Nacht stirbt Belsazar.","Wer Gott verspottet, wird gewogen.","Wie würde mein Leben auf Gottes Waage aussehen?"],
["proph","Daniel in der Löwengrube","DAN.6.1-29","Neider erwirken ein Gebetsverbot. Daniel betet weiter dreimal am Tag bei offenem Fenster. Er wird zu den Löwen geworfen, doch Gott verschließt ihnen das Maul.","Gebet ist es wert, alles zu riskieren. Gott ist treu.","Was würde mich vom Beten abhalten?"],
["proph","Jona flieht vor Gott","JON.1.1-16|JON.2.1-11","Jona soll Ninive warnen, flieht aber mit einem Schiff. Im Sturm wird er ins Meer geworfen und von einem großen Fisch verschluckt. Im Bauch betet er, und Gott rettet ihn.","Man kann vor Gott nicht davonlaufen, aber man kann zu ihm umkehren.","Wo laufe ich gerade vor Gott weg?"],
["proph","Jona in Ninive","JON.3.1-10|JON.4.1-11","Jona predigt, Ninive kehrt um, und Gott verschont die Stadt. Jona ist wütend. Gott lehrt ihn mit einer Staude: Sollte mir diese große Stadt nicht leidtun?","Gottes Gnade ist größer als unser Herz für andere.","Wem gönne ich Gottes Gnade nicht?"],
["proph","Ester rettet ihr Volk","EST.4.1-17|EST.5.1-14|EST.6.1-14|EST.7.1-10|EST.8.1-17","Haman will alle Juden töten lassen. Mordechai sagt zu Königin Ester: Vielleicht bist du gerade für diese Zeit Königin geworden. Ester riskiert ihr Leben und geht zum König.","Gott stellt dich an deinen Platz, damit du handelst.","Wofür hat Gott mich an meinen Platz gestellt?"],
["proph","Nehemia baut die Mauer","NEH.3.33-38|NEH.4.1-17|NEH.6.15-16","Nehemia baut die Mauer Jerusalems wieder auf. Feinde spotten und drohen. Die Bauleute arbeiten mit einer Hand und halten in der anderen die Waffe. Nach 52 Tagen steht die Mauer.","Beten und Anpacken gehören zusammen.","Was baue ich für Gott, auch wenn andere spotten?"],
["proph","Hiob verliert alles","JOB.1.1-22|JOB.2.1-13","Hiob ist reich und gottesfürchtig. An einem Tag verliert er Besitz und Kinder, dann seine Gesundheit. Er sagt: Der Herr hat's gegeben, der Herr hat's genommen.","Glaube, der nur am Segen hängt, ist kein Glaube. Hiob hält an Gott fest.","Würde ich Gott auch ohne seine Gaben lieben?"],
["proph","Gott antwortet Hiob","JOB.38.1-41|JOB.39.1-30|JOB.40.1-32|JOB.41.1-26|JOB.42.1-17","Nach den langen Reden seiner Freunde antwortet Gott aus dem Sturm. Er erklärt das Leid nicht, sondern zeigt seine Größe. Hiob sagt: Jetzt habe ich dich mit eigenen Augen gesehen.","Im Leid hilft keine Erklärung so sehr wie die Begegnung mit Gott.","Suche ich im Leid nach Antworten oder nach Gott?"],
["jes","Der Engel bei Maria","LUK.1.26-38","Der Engel Gabriel kündigt Maria an, dass sie den Sohn Gottes zur Welt bringen wird. Sie fragt: Wie soll das gehen? Dann sagt sie: Mir geschehe, wie du gesagt hast.","Bei Gott ist nichts unmöglich. Hingabe heißt: Ich bin bereit.","Kann ich sagen: Mir geschehe, wie du willst?"],
["jes","Die Geburt von Jesus","LUK.2.1-20","Jesus wird in Bethlehem geboren und in eine Futterkrippe gelegt. Engel erscheinen Hirten auf dem Feld: Euch ist heute der Heiland geboren. Die Hirten eilen hin und erzählen es weiter.","Gott kommt ganz unten an, für die Kleinen und Übersehenen.","Habe ich Platz für Jesus in meinem Leben?"],
["jes","Die Weisen aus dem Morgenland","MAT.2.1-23","Sterndeuter folgen einem Stern nach Jerusalem und Bethlehem. Sie beten das Kind an und bringen Gold, Weihrauch und Myrrhe. Herodes will das Kind töten, doch Josef flieht mit Maria und Jesus nach Ägypten.","Wer Jesus wirklich sucht, findet ihn und betet an.","Was bringe ich Jesus?"],
["jes","Simeon und Hanna","LUK.2.22-40","Der alte Simeon hat sein Leben lang auf den Retter gewartet. Im Tempel nimmt er das Baby Jesus in die Arme und lobt Gott. Auch die Prophetin Hanna erkennt ihn.","Wer treu wartet, sieht Gottes Versprechen erfüllt.","Worauf warte ich von Gott?"],
["jes","Der 12-jährige Jesus im Tempel","LUK.2.41-52","Nach dem Fest bleibt Jesus in Jerusalem. Seine Eltern suchen ihn drei Tage und finden ihn im Tempel bei den Lehrern. Er sagt: Wisst ihr nicht, dass ich sein muss in dem, was meines Vaters ist?","Schon jung kann man Gott an die erste Stelle setzen.","Wo bin ich zu Hause?"],
["jes","Die Taufe von Jesus","MAT.3.13-17","Jesus lässt sich von Johannes im Jordan taufen. Der Himmel öffnet sich, der Geist kommt wie eine Taube, und der Vater sagt: Das ist mein lieber Sohn.","Bevor Jesus irgendetwas leistet, sagt der Vater: Ich liebe dich.","Lebe ich aus Leistung oder aus Gottes Liebe?"],
["jes","Die Versuchung in der Wüste","MAT.4.1-11","Nach 40 Tagen Fasten versucht der Teufel Jesus mit Brot, Macht und Spektakel. Jesus antwortet jedes Mal mit Gottes Wort: Es steht geschrieben.","Gegen Versuchung hilft Gottes Wort im Herzen.","Welche Bibelverse habe ich griffbereit, wenn es eng wird?"],
["jes","Der Fischzug des Petrus","LUK.5.1-11","Petrus hat die ganze Nacht nichts gefangen. Jesus sagt: Fahrt noch einmal hinaus. Auf sein Wort hin werfen sie die Netze aus, die fast reißen. Petrus fällt nieder, und Jesus beruft ihn.","Auf Jesu Wort hin lohnt es sich, gegen die eigene Erfahrung zu handeln.","Wo sagt Jesus mir: Versuch es noch einmal?"],
["wun","Die Hochzeit zu Kana","JHN.2.1-11","Bei einer Hochzeit geht der Wein aus. Maria sagt den Dienern: Was er euch sagt, das tut. Jesus macht Wasser zu bestem Wein. Es ist sein erstes Zeichen.","Jesus bringt Freude, und das Beste kommt zum Schluss.","Wo ist mir der Wein ausgegangen?"],
["wun","Der Gelähmte durchs Dach","MRK.2.1-12","Vier Freunde tragen einen Gelähmten zu Jesus. Weil das Haus voll ist, decken sie das Dach ab. Jesus vergibt ihm zuerst die Sünden, dann heilt er ihn.","Wir brauchen Freunde, die uns zu Jesus bringen. Vergebung ist das größte Wunder.","Für wen bin ich einer der vier Freunde?"],
["wun","Die Sturmstillung","MRK.4.35-41","Auf dem See tobt ein Sturm, Jesus schläft. Die Jünger wecken ihn voller Angst. Jesus bedroht den Wind, und es wird ganz still. Er fragt: Habt ihr noch keinen Glauben?","Mit Jesus im Boot geht man nicht unter.","Welcher Sturm tobt gerade in meinem Leben?"],
["wun","Der Mann aus Gerasa","MRK.5.1-20","Ein besessener Mann lebt zwischen Gräbern, keiner kann ihn bändigen. Jesus befreit ihn. Danach sitzt er angezogen und klar da und soll zu Hause erzählen, was Gott getan hat.","Kein Mensch ist für Jesus ein hoffnungsloser Fall.","Wen habe ich schon aufgegeben?"],
["wun","Jairus' Tochter und die kranke Frau","MRK.5.21-43","Jairus bittet um Hilfe für seine sterbende Tochter. Unterwegs berührt eine kranke Frau Jesu Gewand und wird gesund. Dann kommt die Nachricht: Die Tochter ist tot. Jesus sagt: Fürchte dich nicht, glaube nur, und weckt sie auf.","Für Jesus ist es nie zu spät.","Wo denke ich: Jetzt ist es zu spät?"],
["wun","Die Speisung der 5000","JHN.6.1-15","Tausende hören Jesus zu und haben Hunger. Ein Junge hat fünf Brote und zwei Fische. Jesus dankt und teilt aus, alle werden satt, und zwölf Körbe bleiben übrig.","Gib Jesus das Wenige, das du hast. Er macht daraus genug.","Was halte ich zurück, weil es mir zu wenig scheint?"],
["wun","Jesus geht auf dem Wasser","MAT.14.22-33","Nachts kommt Jesus über den See zu den Jüngern. Petrus steigt aus und geht auf dem Wasser. Als er auf den Wind schaut, sinkt er. Jesus zieht ihn heraus.","Wer auf Jesus schaut, geht. Wer auf den Sturm schaut, sinkt.","Worauf schaue ich gerade?"],
["wun","Die kanaanäische Frau","MAT.15.21-28","Eine fremde Frau bittet für ihre kranke Tochter. Jesus scheint sie abzuweisen. Sie bleibt dran: Auch die Hunde essen von den Brosamen. Jesus lobt ihren großen Glauben.","Beharrlicher Glaube gibt nicht auf, auch wenn Gott zu schweigen scheint.","Gebe ich im Gebet zu schnell auf?"],
["wun","Der Hauptmann von Kapernaum","MAT.8.5-13","Ein römischer Hauptmann bittet für seinen kranken Knecht. Er sagt: Sprich nur ein Wort, dann wird er gesund. Jesus staunt über seinen Glauben.","Jesu Wort genügt, auch aus der Ferne.","Traue ich Jesu Wort allein?"],
["wun","Der blinde Bartimäus","MRK.10.46-52","Der blinde Bettler Bartimäus schreit nach Jesus. Die Leute wollen ihn zum Schweigen bringen, doch er schreit lauter. Jesus fragt: Was willst du? Er wird sehend und folgt Jesus nach.","Jesus bleibt für den stehen, der nach ihm ruft.","Was würde ich antworten, wenn Jesus mich fragt: Was willst du?"],
["wun","Die zehn Aussätzigen","LUK.17.11-19","Zehn Aussätzige rufen um Erbarmen. Jesus schickt sie zu den Priestern, unterwegs werden sie gesund. Nur einer kommt zurück und dankt, ein Samariter.","Dankbarkeit macht aus Heilung Beziehung.","Wofür habe ich Gott noch nicht gedankt?"],
["wun","Der Blindgeborene","JHN.9.1-41","Jesus heilt einen Mann, der blind geboren ist. Die Pharisäer verhören ihn. Er sagt: Eins weiß ich: Ich war blind und bin jetzt sehend.","Dein Zeugnis ist einfach: was Jesus an dir getan hat.","Was hat Jesus an mir verändert?"],
["wun","Lazarus wird auferweckt","JHN.11.1-44","Lazarus ist tot, Jesus kommt erst nach vier Tagen. Er weint mit Marta und Maria und sagt: Ich bin die Auferstehung und das Leben. Dann ruft er Lazarus aus dem Grab.","Jesus weint mit uns und hat Macht über den Tod.","Glaube ich, dass Jesus auch über den Tod Macht hat?"],
["gl","Vom Sämann","MRK.4.1-20","Ein Bauer sät. Manches fällt auf den Weg, auf Felsen, unter Dornen, und manches auf gutes Land, wo es viel Frucht bringt. Jesus erklärt: So wirkt Gottes Wort in verschiedenen Herzen.","Gottes Wort wirkt dort, wo das Herz offen und tief ist.","Welcher Boden ist mein Herz gerade?"],
["gl","Haus auf Fels und Sand","MAT.7.24-27","Zwei Männer bauen Häuser, einer auf Fels, einer auf Sand. Als der Sturm kommt, bleibt nur das Haus auf dem Fels stehen. Fels heißt: Jesu Worte hören und tun.","Hören allein reicht nicht. Tun ist das Fundament.","Worauf baue ich mein Leben?"],
["gl","Der barmherzige Samariter","LUK.10.25-37","Ein Mann wird überfallen. Ein Priester und ein Levit gehen vorbei. Ein verachteter Samariter hilft ihm und bezahlt für ihn. Jesus sagt: Geh hin und tu desgleichen.","Mein Nächster ist der, der mich gerade braucht.","An wem gehe ich vorbei?"],
["gl","Das verlorene Schaf","LUK.15.1-7","Ein Hirte hat 100 Schafe und verliert eines. Er lässt die 99 zurück und sucht, bis er es findet. Im Himmel ist Freude über jeden Sünder, der umkehrt.","Für Gott zählt jeder Einzelne.","Glaube ich, dass Gott gerade mich sucht?"],
["gl","Der verlorene Sohn","LUK.15.11-32","Ein Sohn lässt sich sein Erbe auszahlen und verprasst alles. Er kehrt heim, der Vater läuft ihm entgegen und feiert. Der ältere Bruder ärgert sich und bleibt draußen.","Der Vater wartet mit offenen Armen, auf beide Söhne.","Bin ich der jüngere oder der ältere Sohn?"],
["gl","Der reiche Kornbauer","LUK.12.13-21","Ein Bauer hat eine riesige Ernte und baut größere Scheunen. Er plant, sich zur Ruhe zu setzen. Gott sagt: Du Narr, noch in dieser Nacht wird man deine Seele von dir fordern.","Wer nur für sich sammelt, ist bei Gott arm.","Bin ich reich bei Gott?"],
["gl","Der reiche Mann und Lazarus","LUK.16.19-31","Ein Reicher lebt im Luxus, vor seiner Tür liegt der arme Lazarus. Beide sterben. Lazarus wird bei Abraham getröstet, der Reiche leidet. Zwischen beiden liegt eine Kluft.","Wie wir jetzt mit Gott und den Armen umgehen, hat ewige Folgen.","Wer liegt vor meiner Tür?"],
["gl","Pharisäer und Zöllner","LUK.18.9-14","Ein Pharisäer betet und zählt seine guten Taten auf. Ein Zöllner steht hinten und sagt nur: Gott, sei mir Sünder gnädig. Der Zöllner geht gerechtfertigt nach Hause.","Gott nimmt die Ehrlichen an, nicht die Selbstgerechten.","Bete ich eher wie der Pharisäer oder wie der Zöllner?"],
["gl","Der unbarmherzige Knecht","MAT.18.21-35","Einem Knecht wird eine riesige Schuld erlassen. Danach würgt er einen Kollegen wegen einer kleinen Summe. Der König lässt ihn ins Gefängnis werfen.","Wer Vergebung empfangen hat, soll vergeben.","Wem halte ich noch eine kleine Schuld vor?"],
["gl","Die anvertrauten Talente","MAT.25.14-30","Ein Herr gibt drei Knechten Geld. Zwei arbeiten damit und verdoppeln es. Der dritte vergräbt es aus Angst. Der Herr lobt die Treuen.","Gott erwartet, dass wir mit seinen Gaben arbeiten.","Welches Talent habe ich vergraben?"],
["gl","Die zehn Jungfrauen","MAT.25.1-13","Zehn Brautjungfern warten auf den Bräutigam. Fünf haben genug Öl dabei, fünf nicht. Als er nachts kommt, sind die törichten zu spät.","Sei bereit, Jesus kommt wieder.","Wäre ich bereit, wenn Jesus heute käme?"],
["gl","Die Arbeiter im Weinberg","MAT.20.1-16","Ein Weinbergbesitzer stellt den ganzen Tag über Arbeiter ein. Am Abend bekommen alle den gleichen Lohn. Die Ersten beschweren sich. Er fragt: Bist du neidisch, weil ich gütig bin?","Gnade ist kein Lohn. Gott ist großzügig.","Freue ich mich, wenn Gott anderen gnädig ist?"],
["gl","Senfkorn und Sauerteig","MAT.13.31-33","Das Reich Gottes ist wie ein winziges Senfkorn, das zu einem großen Baum wird. Und wie Sauerteig, der den ganzen Teig durchdringt.","Gott fängt klein an und wirkt durch alles hindurch.","Welche kleinen Anfänge unterschätze ich?"],
["gl","Schatz und Perle","MAT.13.44-46","Ein Mann findet einen Schatz im Acker und verkauft alles, um den Acker zu kaufen. Ein Kaufmann findet eine kostbare Perle und gibt alles dafür.","Jesus ist mehr wert als alles andere. Wer ihn findet, gibt gern.","Ist Jesus für mich der Schatz oder ein Extra?"],
["beg","Nikodemus in der Nacht","JHN.3.1-21","Der Gelehrte Nikodemus kommt nachts zu Jesus. Jesus sagt ihm: Du musst von neuem geboren werden. Dann folgt der berühmteste Vers: Also hat Gott die Welt geliebt.","Religiös sein reicht nicht. Man braucht neues Leben von Gott.","Bin ich neu geboren oder nur religiös?"],
["beg","Die Frau am Brunnen","JHN.4.1-42","Mittags trifft Jesus eine Samariterin am Brunnen. Er bittet sie um Wasser und bietet ihr lebendiges Wasser an. Er kennt ihr ganzes Leben, und sie erzählt dem ganzen Dorf von ihm.","Jesus kennt alles von dir und bietet dir trotzdem Leben an.","Wonach habe ich Durst?"],
["beg","Maria und Marta","LUK.10.38-42","Marta arbeitet in der Küche, Maria sitzt Jesus zu Füßen und hört zu. Marta beschwert sich. Jesus sagt: Maria hat das gute Teil gewählt.","Bei Jesus sitzen ist wichtiger, als für Jesus zu rennen.","Bin ich mehr Marta oder Maria?"],
["beg","Zachäus","LUK.19.1-10","Der reiche Zöllner Zachäus klettert auf einen Baum, um Jesus zu sehen. Jesus ruft ihn herunter und kehrt bei ihm ein. Zachäus gibt die Hälfte den Armen und erstattet Betrug vierfach zurück.","Jesus sucht die Verlorenen. Echte Begegnung verändert auch den Umgang mit Geld.","Was würde sich ändern, wenn Jesus heute bei mir einkehrt?"],
["beg","Der reiche junge Mann","MRK.10.17-27","Ein junger Mann fragt nach dem ewigen Leben. Er hält alle Gebote. Jesus liebt ihn und sagt: Verkaufe alles und folge mir. Er geht traurig weg, denn er hat viele Güter.","Was mehr zählt als Jesus, wird zum Hindernis.","Was dürfte Jesus mir nicht nehmen?"],
["beg","Die Ehebrecherin","JHN.8.1-11","Schriftgelehrte bringen eine Frau, die beim Ehebruch ertappt wurde. Jesus sagt: Wer ohne Sünde ist, werfe den ersten Stein. Alle gehen weg. Jesus: Ich verurteile dich nicht, geh und sündige nicht mehr.","Jesus verurteilt nicht, aber er ruft in ein neues Leben.","Mit welchem Stein in der Hand stehe ich da?"],
["beg","Jesus segnet die Kinder","MRK.10.13-16","Eltern bringen Kinder zu Jesus, die Jünger wollen sie wegschicken. Jesus wird unwillig: Lasst die Kinder zu mir kommen. Wer das Reich Gottes nicht annimmt wie ein Kind, kommt nicht hinein.","Glaube heißt, wie ein Kind zu vertrauen.","Kann ich Gott wie ein Kind vertrauen?"],
["beg","Die Salbung in Betanien","MRK.14.3-9","Eine Frau zerbricht ein Glas mit teurem Öl und gießt es über Jesus. Die Jünger nennen es Verschwendung. Jesus sagt: Sie hat ein gutes Werk an mir getan.","Für Jesus ist nichts zu wertvoll.","Was ist mir für Jesus zu schade?"],
["beg","Petrus bekennt","MAT.16.13-20","Jesus fragt: Wer sagen die Leute, dass ich bin? Und ihr? Petrus antwortet: Du bist der Christus, der Sohn des lebendigen Gottes.","Die wichtigste Frage deines Lebens: Wer ist Jesus für dich?","Was antworte ich, wenn Jesus mich fragt: Wer bin ich für dich?"],
["beg","Die Verklärung","MAT.17.1-9","Auf einem Berg leuchtet Jesus vor drei Jüngern, Mose und Elia erscheinen. Eine Stimme sagt: Das ist mein lieber Sohn, den sollt ihr hören. Danach sehen sie nur noch Jesus.","Am Ende bleibt Jesus allein. Auf ihn sollen wir hören.","Auf wen höre ich am meisten?"],
["pass","Einzug in Jerusalem","MRK.11.1-11","Jesus reitet auf einem Esel in Jerusalem ein. Die Menge breitet Kleider und Zweige aus und ruft Hosianna. Wenige Tage später rufen viele: Kreuzige ihn! (Markus 15,13)","Jesus ist ein König, der demütig kommt. Begeisterung ist noch kein Glaube.","Jubele ich Jesus nur zu, wenn es passt?"],
["pass","Die Tempelreinigung","MRK.11.15-19","Jesus wirft die Händler aus dem Tempel und stößt ihre Tische um. Er sagt: Mein Haus soll ein Bethaus sein, ihr habt eine Räuberhöhle daraus gemacht.","Jesus räumt auf, wo Geschäft wichtiger wird als Gott.","Was müsste Jesus in meinem Leben umstoßen?"],
["pass","Die Fußwaschung","JHN.13.1-17","Beim letzten Mahl bindet Jesus sich ein Tuch um und wäscht den Jüngern die Füße, eine Arbeit für Sklaven. Petrus wehrt sich. Jesus: Ich habe euch ein Beispiel gegeben.","Größe im Reich Gottes heißt dienen.","Wem könnte ich diese Woche dienen?"],
["pass","Das letzte Abendmahl","LUK.22.7-23","Jesus feiert mit den Jüngern das Passa. Er bricht das Brot: Das ist mein Leib. Er nimmt den Kelch: der neue Bund in meinem Blut. Das tut zu meinem Gedächtnis.","Jesus gibt sich selbst für uns. Das Abendmahl erinnert daran.","Was bedeutet mir das Abendmahl?"],
["pass","Gethsemane","MRK.14.32-50","Jesus betet in Todesangst: Vater, nimm diesen Kelch von mir, doch nicht, was ich will, sondern was du willst. Die Jünger schlafen ein. Dann wird er verhaftet.","Jesus kennt Angst. Und er wählt Gottes Willen.","Kann ich beten: Nicht mein Wille, sondern deiner?"],
["pass","Petrus verleugnet Jesus","LUK.22.54-62","Petrus folgt Jesus bis in den Hof des Hohepriesters. Dreimal sagt er: Ich kenne ihn nicht. Der Hahn kräht, Jesus sieht ihn an, und Petrus weint bitterlich.","Auch die Treuesten fallen. Jesu Blick führt zur Umkehr.","Wo habe ich Jesus verleugnet?"],
["pass","Die Kreuzigung","LUK.23.26-56","Jesus wird zwischen zwei Verbrechern gekreuzigt. Er betet: Vater, vergib ihnen. Einem der Verbrecher verspricht er das Paradies. Dann stirbt er.","Am Kreuz trägt Jesus unsere Schuld und vergibt sogar seinen Feinden.","Welcher der beiden Verbrecher bin ich?"],
["pass","Das leere Grab","JHN.20.1-18","Maria Magdalena findet das Grab leer und weint. Jesus spricht sie an, sie hält ihn für den Gärtner. Als er ihren Namen sagt, erkennt sie ihn.","Jesus lebt und kennt dich beim Namen.","Habe ich den Auferstandenen schon persönlich erlebt?"],
["pass","Die Emmausjünger","LUK.24.13-35","Zwei enttäuschte Jünger gehen nach Emmaus. Jesus geht unerkannt mit und erklärt ihnen die Schrift. Beim Brotbrechen erkennen sie ihn: Brannte nicht unser Herz?","Jesus geht mit, auch wenn wir ihn nicht erkennen.","Auf welchem Weg der Enttäuschung bin ich gerade?"],
["pass","Thomas zweifelt","JHN.20.24-29","Thomas glaubt nicht, dass Jesus lebt, bevor er die Wunden sieht. Jesus kommt und lädt ihn ein, sie zu berühren. Thomas sagt: Mein Herr und mein Gott!","Jesus nimmt Zweifler ernst und begegnet ihnen.","Welche Zweifel darf ich Jesus ehrlich bringen?"],
["pass","Petrus wird wiederhergestellt","JHN.21.1-19","Am See frühstückt der Auferstandene mit den Jüngern. Dreimal fragt er Petrus: Hast du mich lieb? Dreimal antwortet Petrus. Jesus: Weide meine Schafe.","Jesus stellt Gefallene wieder her und gibt ihnen einen neuen Auftrag.","Glaube ich, dass Jesus mich nach meinem Versagen wieder gebraucht?"],
["pass","Der Missionsbefehl","MAT.28.16-20","Jesus sagt: Mir ist alle Macht gegeben. Geht hin, macht alle Völker zu Jüngern, tauft und lehrt sie. Ich bin bei euch alle Tage bis ans Ende der Welt.","Jeder Christ hat einen Auftrag und eine Zusage.","Wem erzähle ich von Jesus?"],
["apg","Die Himmelfahrt","ACT.1.1-11","Jesus verspricht den Heiligen Geist und sendet die Jünger bis an das Ende der Erde. Dann wird er vor ihren Augen aufgenommen. Engel sagen: Er wird wiederkommen.","Jesus regiert jetzt und kommt wieder. Bis dahin sind wir seine Zeugen.","Lebe ich so, als würde Jesus wiederkommen?"],
["apg","Pfingsten","ACT.2.1-47","Der Heilige Geist kommt wie Sturm und Feuer auf die Jünger. Sie reden in fremden Sprachen. Petrus predigt, und 3000 Menschen lassen sich taufen. Die Gemeinde ist geboren.","Der Geist macht aus ängstlichen Jüngern mutige Zeugen.","Wo brauche ich den Mut des Heiligen Geistes?"],
["apg","Der Gelähmte an der Schönen Pforte","ACT.3.1-10","Ein Gelähmter bettelt am Tempeltor. Petrus sagt: Silber und Gold habe ich nicht, aber was ich habe, gebe ich dir. Im Namen Jesu steh auf! Er springt umher und lobt Gott.","Das Wertvollste, was wir geben können, ist Jesus.","Was habe ich, das ich weitergeben kann?"],
["apg","Hananias und Saphira","ACT.5.1-11","Ein Ehepaar verkauft einen Acker und behält heimlich einen Teil, tut aber so, als gäben sie alles. Petrus deckt die Lüge auf. Beide sterben.","Gott will Echtheit, keinen frommen Schein.","Wo spiele ich mehr Frömmigkeit vor, als da ist?"],
["apg","Stephanus","ACT.6.8-15|ACT.7","Stephanus ist voller Glauben und Kraft. Nach seiner Rede wird er gesteinigt. Er sieht den Himmel offen und betet: Herr, rechne ihnen diese Sünde nicht an.","Wer Jesus vor Augen hat, kann sogar im Sterben vergeben.","Könnte ich meinen Feinden vergeben?"],
["apg","Philippus und der Kämmerer","ACT.8.26-36,38-40","Ein äthiopischer Finanzminister liest Jesaja 53 und versteht es nicht. Philippus erklärt ihm Jesus. Der Mann lässt sich am Wegrand taufen und zieht fröhlich weiter.","Gott schickt uns zu Menschen, die gerade suchen.","Wer in meinem Umfeld sucht gerade?"],
["apg","Saulus wird Paulus","ACT.9.1-19","Saulus verfolgt die Christen. Vor Damaskus umleuchtet ihn ein Licht, und Jesus fragt: Warum verfolgst du mich? Saulus ist blind, Hananias betet für ihn, und er wird getauft.","Niemand ist zu weit weg für Jesus.","Für wen bete ich, der weit weg von Gott ist?"],
["apg","Petrus und Kornelius","ACT.10.1-48","Petrus sieht in einer Vision unreine Tiere: Was Gott rein gemacht hat, nenne nicht unrein. Dann geht er zum römischen Hauptmann Kornelius. Der Geist kommt auch auf die Nichtjuden.","Das Evangelium ist für alle Menschen, ohne Unterschied.","Welche Menschen halte ich für zu anders für Gott?"],
["apg","Petrus wird befreit","ACT.12.1-17","Petrus liegt in Ketten im Gefängnis, die Gemeinde betet. Ein Engel befreit ihn. Er klopft an, und die Magd Rhode ist so froh, dass sie vergisst aufzumachen. Die Betenden können es kaum glauben.","Gott erhört Gebet, oft mehr, als wir selbst erwarten.","Rechne ich damit, dass Gott mein Gebet erhört?"],
["apg","Paulus und Silas im Gefängnis","ACT.16.16-34","Paulus und Silas werden geschlagen und eingesperrt. Um Mitternacht singen sie Loblieder. Ein Erdbeben öffnet die Türen. Der Gefängniswärter fragt: Was muss ich tun, damit ich gerettet werde?","Lob in der dunkelsten Stunde öffnet Türen, auch für andere.","Kann ich auch um Mitternacht Gott loben?"],
["apg","Paulus in Athen","ACT.17.16-34","In Athen findet Paulus einen Altar für einen unbekannten Gott. Er knüpft daran an und verkündet den Gott, der Himmel und Erde gemacht und Jesus auferweckt hat.","Gute Verkündigung knüpft an das an, was Menschen schon kennen.","Woran kann ich bei meinen Freunden anknüpfen?"],
["apg","Schiffbruch vor Malta","ACT.27.1-44|ACT.28.1-10","Paulus ist als Gefangener auf einem Schiff. Ein schwerer Sturm dauert tagelang. Paulus ermutigt alle: Gott hat mir gesagt, keiner wird umkommen. Das Schiff zerbricht, alle 276 kommen an Land.","Gottes Zusage trägt durch den Sturm, auch wenn das Schiff zerbricht.","Woran halte ich mich fest, wenn alles zerbricht?"],
["apg","Die neue Erde","REV.21.1-7","Johannes sieht einen neuen Himmel und eine neue Erde. Gott wohnt bei den Menschen und wischt alle Tränen ab. Kein Tod und kein Leid mehr. Siehe, ich mache alles neu.","Die Geschichte endet nicht im Leid, sondern bei Gott.","Was gibt mir Hoffnung, wenn ich an die Zukunft denke?"]

{k:"bibel-motivation", n:"Keine Lust zum Bibellesen", c:"glaube", w:"keine motivation|keine lust|bibel lesen|bibellesen|lesen|motivation|langweilig|verstehe die bibel nicht|keine zeit|stille zeit|dranbleiben|disziplin|wo anfangen|wie lese ich die bibel",
 note:"Fast jeder Christ kennt Zeiten, in denen Bibellesen schwerfällt. Die Lust kommt oft erst beim Tun, nicht vorher. Fang klein an: ein Psalm oder ein kurzer Abschnitt aus Markus, jeden Tag zur gleichen Zeit. Bete vorher kurz: „Herr, zeig mir etwas.“ Gottes Wort wirkt, auch wenn du es gerade nicht spürst.",

{k:"gott-fern", n:"Gott fühlt sich weit weg an", c:"glaube", w:"gott ist weit weg|gott fern|ich spüre gott nicht|spüre gott nicht|gott schweigt|keine verbindung zu gott|gott weg|trocken|wüste|glaube fühlt sich leer an|gott antwortet nicht",

{k:"gefuehle-unklar", n:"Ich weiß nicht, was ich fühle", c:"seele", w:"weiß nicht was ich fühle|weiß nicht was ich fühlen soll|was soll ich fühlen|gefühle|gefühl|fühlen|gefühlschaos|durcheinander|verwirrt|taub|abgestumpft|nichts fühlen|emotionen|innerlich leer|komisch",
